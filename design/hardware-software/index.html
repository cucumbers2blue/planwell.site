<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Grade 6 Design flashcards for hardware, software, input and output devices."
    />
    <meta name="theme-color" content="#f4f1e8" />
    <title>Digital Systems Lab | Grade 6 Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750;12..96,800&family=DM+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="input-output-deck.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="app">
      <section id="home-view" class="home-shell">
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>

        <header class="topbar">
          <div class="brand-mark">DS</div>
          <div>
            <p class="brand-name">Digital Systems Lab</p>
            <p class="brand-meta">Grade 6 · Design</p>
          </div>
          <span class="week-chip">This week</span>
        </header>

        <section class="hero">
          <p class="eyebrow">Hardware + Software</p>
          <h1>Choose your challenge.</h1>
          <p class="hero-copy">
            Pick a deck. Cards you miss will come back until you have
            mastered every one.
          </p>
          <div
            class="system-line"
            aria-label="The relationship between hardware and software"
          >
            <span>YOU</span>
            <i>→</i>
            <span>HARDWARE</span>
            <i>↔</i>
            <span>SOFTWARE</span>
          </div>
        </section>

        <section
          id="deck-grid"
          class="deck-grid"
          aria-label="Choose a flashcard deck"
        ></section>

        <footer>
          <span>Learn it.</span>
          <span>Test it.</span>
          <span>Master it.</span>
        </footer>
      </section>

      <section id="practice-view" class="practice-shell" hidden>
        <header class="practice-header">
          <button id="back-button" class="back-button" type="button">
            ← Decks
          </button>
          <div class="practice-title">
            <span id="deck-number"></span>
            <strong id="deck-title"></strong>
          </div>
          <span id="mastery-count" class="mastery-count"></span>
        </header>

        <div
          id="progress-track"
          class="progress-track"
          role="progressbar"
          aria-valuemin="0"
        >
          <div id="progress-fill" class="progress-fill"></div>
        </div>

        <section class="question-wrap">
          <div class="question-meta">
            <span>Choose the best answer</span>
            <span id="cards-in-play"></span>
          </div>

          <article class="question-card">
            <h1 id="question"></h1>
            <div id="answer-list" class="answer-list"></div>
            <div id="feedback" class="feedback" aria-live="polite"></div>
          </article>
        </section>
      </section>

      <section id="completion-view" class="completion-shell" hidden>
        <div class="completion-card">
          <span class="completion-icon" aria-hidden="true">✓</span>
          <p class="eyebrow">Deck complete</p>
          <h1 id="completion-heading"></h1>
          <p id="completion-copy"></p>
          <div class="completion-actions">
            <button id="replay-button" class="primary-button" type="button">
              Play this deck again
            </button>
            <button id="other-deck-button" class="text-button" type="button">
              Choose another deck
            </button>
          </div>
        </div>
      </section>
    </main>

    <noscript>
      <p class="noscript">
        This flashcard activity needs JavaScript enabled in your browser.
      </p>
    </noscript>
  </body>
</html>
