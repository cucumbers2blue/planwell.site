<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classes</title>
<style>
  :root { color-scheme: light; --bg:#f6f6f3; --ink:#20242a; --muted:#61665f; --line:#e4e4dd; --surface:#ffffff; --accent:#2f6072; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; padding:24px; background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  main { width:min(100%,640px); margin:0 auto; padding:28px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
  h1 { margin:0 0 6px; font-size:1.5rem; }
  p { margin:0 0 20px; color:var(--muted); }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  a { color:var(--accent); text-decoration:none; font-weight:600; display:block; padding:10px 12px; border:1px solid var(--line); border-radius:6px; }
  a:hover { border-color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Classes</h1>
  <p>Choose your class.</p>
  <ul>
    <li><a href="/classes/6-music/">6 Music</a></li>
    <li><a href="/classes/6-design/">6 Design</a></li>
    <li><a href="/classes/7-music/">7 Music</a></li>
    <li><a href="/classes/8-music/">8 Music</a></li>
    <li><a href="/classes/9-music/">9 Music</a></li>
    <li><a href="/classes/10-music/">10 Music</a></li>
  </ul>
</main>
</body>
</html>
